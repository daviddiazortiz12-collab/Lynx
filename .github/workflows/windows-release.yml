name: Build & Verify Windows Self-Contained Release

on:
  push:
    branches:
      - arena/799dcf14-lynx
    paths:
      - 'src/**'
      - 'tests/**'
      - 'IEGORandomizer.sln'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch arena/799dcf14-lynx
        uses: actions/checkout@v4
        with:
          ref: arena/799dcf14-lynx
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Official Microsoft NuGet Feed for Windows x64 Runtime Packs
        shell: pwsh
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.Config

      - name: Run All 33 Automated Integrity, Anti-Softlock, PirateLegit CIA, Nutb Bytecode & 2DS Hardware Verification Tests
        shell: pwsh
        run: |
          dotnet run --project tests/IEGORandomizer.Tests/IEGORandomizer.Tests.csproj --configuration Release

      - name: Verify HTTP Host Endpoints (/api/health == 1.2.2 & Embedded UI)
        shell: pwsh
        run: |
          dotnet build src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-restore
          $proc = Start-Process -FilePath "dotnet" `
            -ArgumentList "src/IEGORandomizer.App/bin/Release/net10.0/IEGORandomizer.dll","--no-browser","--port","5189" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5189/api/health" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.version -eq "1.2.2") {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) {
              throw "IEGORandomizer v1.2.2 failed to respond on http://127.0.0.1:5189/api/health"
            }
            $indexResp = Invoke-WebRequest -Uri "http://127.0.0.1:5189/"
            if ($indexResp.StatusCode -ne 200 -or $indexResp.Content -notmatch "v1.2.2") {
              throw "Embedded v1.2.2 index.html check failed."
            }
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5189/api/app/shutdown" | Out-Null
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Publish Standalone Self-Contained Windows x64 Executable (.exe) v1.2.2 + 1-Click FBI Update Launchers
        shell: pwsh
        run: |
          $outDir = "publish_win64/IEGORandomizer-v1.2.2-Windows-x64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet publish src/IEGORandomizer.App/IEGORandomizer.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output $outDir

          if (Test-Path "$outDir/wwwroot") {
            Remove-Item -Recurse -Force "$outDir/wwwroot"
          }
          Get-ChildItem -Path $outDir -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue

          # Verify genuine PE32+ x86-64 Windows executable header (MZ + PE\0\0 + 0x8664)
          $exePath = "$outDir/IEGORandomizer.exe"
          if (-not (Test-Path $exePath)) {
            throw "IEGORandomizer.exe was not produced!"
          }
          $fileInfo = (& file $exePath) | Out-String
          Write-Host "PE Binary Verification: $fileInfo"
          if ($fileInfo -notmatch "PE32\+" -or $fileInfo -notmatch "x86-64") {
            throw "Expected PE32+ x86-64 Windows executable, got: $fileInfo"
          }

          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat" "$outDir/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat" "$outDir/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/LEEME_ACTUALIZACION_FBI_2DS_v1.2.2.txt" "$outDir/LEEME_ACTUALIZACION_FBI_2DS_v1.2.2.txt"

          Write-Host "Published v1.2.2 directory contents:"
          Get-ChildItem -Path $outDir | Format-Table Name, Length -AutoSize

      - name: Package v1.2.2 ZIP, Create v1.2.2-win64 Release & Record Checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path "release/IEGORandomizer-Windows-x64.zip")) {
            throw "Safety check failed: original v1.0.2 release/IEGORandomizer-Windows-x64.zip must remain intact!"
          }

          $v122Dir = "release/v1.2.2"
          New-Item -ItemType Directory -Force -Path $v122Dir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "IEGORandomizer-v1.2.2-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }

          Compress-Archive -Path "publish_win64/IEGORandomizer-v1.2.2-Windows-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal

          $exeHash = (Get-FileHash "publish_win64/IEGORandomizer-v1.2.2-Windows-x64/IEGORandomizer.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $zipSizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)

          @(
            "$zipHash  IEGORandomizer-v1.2.2-Windows-x64.zip ($zipSizeMb MB)"
            "$exeHash  IEGORandomizer.exe (v1.2.2)"
          ) | Set-Content -Path "$v122Dir/SHA256SUMS.txt" -Encoding UTF8

          Write-Host "Packaged $zipPath ($zipSizeMb MB) - SHA256: $zipHash"

          $tagName = "v1.2.2-win64"
          $existing = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $zipPath "$v122Dir/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tagName $zipPath "$v122Dir/SHA256SUMS.txt" `
              --target arena/799dcf14-lynx `
              --title "IEGO Randomizer v1.2.2 (Windows x64 — 100% Jugadores con Técnica Nv.1 o EG + Anti-Softlock Tiro Inicial y Pachangas + FBI V.1.2.2)" `
              --notes "Versión ejecutable independiente (self-contained) v1.2.2 para Windows 10/11 (64 bits) con lanzadores automáticos en 1 clic de Actualización FBI (V.1.2.2 = 1058 > V.1.2.1 = 1057) para Nintendo 2DS/3DS. Garantiza: (1) EL 100% DE TODOS LOS JUGADORES JUGABLES DEL JUEGO (incluidos todos los de pachanga, reclutables, rivales y Raimon, sin excepción) vienen con AL MENOS 1 supertécnica activa a Nivel 1 (con PT suficientes) o 1 Espíritu Guerrero inicial jugable (FightingSpiritHash + FightingSpiritMatchkHash); (2) Garantía 100% de supertécnica individual de TIRO (whsXXXX, PartnerNumber <= 1, PT <= 45) a Nivel 1 en Arion (para_cp0008), Riccardo (para_cp0009) y al menos 2 titulares tempranos más del Raimon; (3) Anti-softlock en porterías de pachanga 5v5: los jugadores en portería de pachanga reciben su técnica Nv.1 o EG de campo (Tiro/Regate/Bloqueo, nunca paradas de portero whkXXXX/wkkXXXX ni Catch inflado a 65..95); (4) Incluye todos los arreglos de v1.2.0 (duelo Victor btl0302, formaciones ifb01XX, técnicas dinámicas .nutb y randomización de Entrenadores, Gerentes y NPCs)."
          }

          git checkout -- NuGet.Config

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$v122Dir/SHA256SUMS.txt"
          git diff --cached --quiet || (git commit -m "chore(release): record Windows x64 self-contained v1.2.2 release checksums [skip ci]" && git push origin HEAD:arena/799dcf14-lynx)
