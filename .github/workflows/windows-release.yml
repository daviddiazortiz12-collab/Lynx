name: Build & Verify Windows Self-Contained Release

on:
  push:
    branches:
      - arena/799dcf14-lynx
    paths:
      - 'src/**'
      - 'tests/**'
      - 'IEGORandomizer.sln'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout branch arena/799dcf14-lynx
        uses: actions/checkout@v4
        with:
          ref: arena/799dcf14-lynx
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Official Microsoft NuGet Feed for Windows Runtime Packs
        shell: pwsh
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.Config

      - name: Run All Automated Integrity, Engine, PirateLegit CIA, Nutb Bytecode & 2DS Hardware Verification Tests on Windows x64
        shell: pwsh
        run: |
          dotnet run --project tests/IEGORandomizer.Tests/IEGORandomizer.Tests.csproj --configuration Release

      - name: Publish Standalone Self-Contained Windows x64 Executable (.exe) v1.2.0 + 1-Click FBI Update Launchers
        shell: pwsh
        run: |
          $outDir = "publish_win64/IEGORandomizer-v1.2.0-Windows-x64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet publish src/IEGORandomizer.App/IEGORandomizer.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output $outDir

          if (Test-Path "$outDir/wwwroot") {
            Remove-Item -Recurse -Force "$outDir/wwwroot"
          }
          Get-ChildItem -Path $outDir -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue

          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat" "$outDir/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat" "$outDir/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/LEEME_ACTUALIZACION_FBI_2DS_v1.2.0.txt" "$outDir/LEEME_ACTUALIZACION_FBI_2DS_v1.2.0.txt"

          Write-Host "Published v1.2.0 directory contents:"
          Get-ChildItem -Path $outDir | Format-Table Name, Length -AutoSize

      - name: Verify Isolated Single-File .exe Startup, CLI Modes & HTTP Endpoints on Windows
        shell: pwsh
        run: |
          $isoDir = Join-Path $env:RUNNER_TEMP "isolated_exe_verify_v120"
          New-Item -ItemType Directory -Force -Path $isoDir | Out-Null
          Copy-Item "publish_win64/IEGORandomizer-v1.2.0-Windows-x64/IEGORandomizer.exe" "$isoDir/IEGORandomizer.exe"

          # 1. Verify CLI help boots cleanly without external DLLs or .NET lookup
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $helpOut = & "$isoDir/IEGORandomizer.exe" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpOut -notmatch "--output-cia" -or $helpOut -notmatch "--fbi-update" -or $helpOut -notmatch "v1.2.0") {
            throw "IEGORandomizer.exe --help verification failed."
          }

          # 2. Verify Desktop GUI HTTP host boots cleanly from isolated single-file .exe
          $proc = Start-Process -FilePath "$isoDir/IEGORandomizer.exe" `
            -ArgumentList "--no-browser","--port","5189" `
            -WorkingDirectory $isoDir `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5189/api/health" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.version -eq "1.2.0") {
                  $ready = $true
                  break
                }
              } catch { }
            }

            if (-not $ready) {
              throw "IEGORandomizer.exe v1.2.0 failed to respond on http://127.0.0.1:5189/api/health"
            }

            $indexResp = Invoke-WebRequest -Uri "http://127.0.0.1:5189/" -UseBasicParsing
            if ($indexResp.StatusCode -ne 200 -or $indexResp.Content -notmatch "v1.2.0") {
              throw "Embedded v1.2.0 index.html check failed."
            }

            $jsResp = Invoke-WebRequest -Uri "http://127.0.0.1:5189/app.js" -UseBasicParsing
            if ($jsResp.StatusCode -ne 200) {
              throw "Embedded app.js check failed."
            }

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5189/api/app/shutdown" | Out-Null
            Start-Sleep -Seconds 1
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package v1.2.0 ZIP, Create v1.2.0-win64 Release & Record Checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path "release/IEGORandomizer-Windows-x64.zip")) {
            throw "Safety check failed: original v1.0.2 release/IEGORandomizer-Windows-x64.zip must remain intact!"
          }

          $v120Dir = "release/v1.2.0"
          New-Item -ItemType Directory -Force -Path $v120Dir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "IEGORandomizer-v1.2.0-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }

          Compress-Archive -Path "publish_win64/IEGORandomizer-v1.2.0-Windows-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal

          $exeHash = (Get-FileHash "publish_win64/IEGORandomizer-v1.2.0-Windows-x64/IEGORandomizer.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $zipSizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)

          @(
            "$zipHash  IEGORandomizer-v1.2.0-Windows-x64.zip ($zipSizeMb MB)"
            "$exeHash  IEGORandomizer.exe (v1.2.0)"
          ) | Set-Content -Path "$v120Dir/SHA256SUMS.txt" -Encoding UTF8

          Write-Host "Packaged $zipPath ($zipSizeMb MB) - SHA256: $zipHash"

          $tagName = "v1.2.0-win64"
          $existing = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $zipPath "$v120Dir/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tagName $zipPath "$v120Dir/SHA256SUMS.txt" `
              --target arena/799dcf14-lynx `
              --title "IEGO Randomizer v1.2.0 (Windows x64 — Fix Duelo Victor btl0302 + Pachangas + Técnicas Dinámicas .nutb + Entrenadores/Gerentes/NPCs + Actualización FBI V.1.2.0)" `
              --notes "Versión ejecutable independiente (self-contained) v1.2.0 para Windows 10/11 (64 bits) con lanzadores automáticos en 1 clic de Actualización FBI (V.1.2.0 > V.1.1.2) para Nintendo 2DS/3DS. Incluye: (1) Fix definitivo del duelo 1v1 contra Victor Blade (btl0302 / ifb0302 / Uniform 903000) y preservación esquelética 1-a-1 de Espíritus Guerreros (vkaNNNN_ckNNNN.xc) + Arion/JP a 0 hasta su despertar; (2) Exclusión de formaciones de duelo 1v1/2v2 (ifb03XX) y equipaciones no registradas en ITEM_UNIFORM en todas las pachangas 5v5; (3) 1 supertécnica activa Nv.1 o EG inicial garantizado en todos los jugadores (100% garantizada en Arion para_cp0008 y JP para_cp0005); (4) Intercambio dinámico de técnicas de historia en bytecode Squirrel (.nutb) desbloqueando el 100% de movesets del Raimon sin técnicas vanilla congeladas; (5) Randomización de Entrenadores (ItemConfigDirector + textos en español Dir-N-1/2 + reclutamiento), Gerentes (Skie, Jade, Rosie, Celia) y NPCs humanos de historia y mapa (.npc.bin); (6) Actualización directa FBI V.1.2.0 (TitleVersion 1056 > 1042) lista para instalar encima en 2DS conservando tu partida."
          }

          git checkout -- NuGet.Config

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$v120Dir/SHA256SUMS.txt"
          git diff --cached --quiet || (git commit -m "chore(release): record Windows x64 self-contained v1.2.0 release checksums [skip ci]" && git push origin HEAD:arena/799dcf14-lynx)
