name: Build & Verify Windows Self-Contained Release

on:
  push:
    branches:
      - arena/799dcf14-lynx
    paths:
      - 'src/**'
      - 'tests/**'
      - 'IEGORandomizer.sln'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout branch arena/799dcf14-lynx
        uses: actions/checkout@v4
        with:
          ref: arena/799dcf14-lynx
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Official Microsoft NuGet Feed for Windows Runtime Packs
        shell: pwsh
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.Config

      - name: Run All Automated Integrity, Engine, PirateLegit CIA, Nutb Bytecode & 2DS Hardware Verification Tests on Windows x64
        shell: pwsh
        run: |
          dotnet run --project tests/IEGORandomizer.Tests/IEGORandomizer.Tests.csproj --configuration Release

      - name: Publish Standalone Self-Contained Windows x64 Executable (.exe) v1.2.1 + 1-Click FBI Update Launchers
        shell: pwsh
        run: |
          $outDir = "publish_win64/IEGORandomizer-v1.2.1-Windows-x64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet publish src/IEGORandomizer.App/IEGORandomizer.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output $outDir

          if (Test-Path "$outDir/wwwroot") {
            Remove-Item -Recurse -Force "$outDir/wwwroot"
          }
          Get-ChildItem -Path $outDir -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue

          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat" "$outDir/Generar_Actualizacion_FBI_2DS_TITAN-C45C-614C.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat" "$outDir/Generar_Actualizacion_FBI_2DS_Nueva_Semilla.bat"
          Copy-Item "src/IEGORandomizer.App/Packaging/LEEME_ACTUALIZACION_FBI_2DS_v1.2.1.txt" "$outDir/LEEME_ACTUALIZACION_FBI_2DS_v1.2.1.txt"

          Write-Host "Published v1.2.1 directory contents:"
          Get-ChildItem -Path $outDir | Format-Table Name, Length -AutoSize

      - name: Verify Isolated Single-File .exe Startup, CLI Modes & HTTP Endpoints on Windows
        shell: pwsh
        run: |
          $isoDir = Join-Path $env:RUNNER_TEMP "isolated_exe_verify_v121"
          New-Item -ItemType Directory -Force -Path $isoDir | Out-Null
          Copy-Item "publish_win64/IEGORandomizer-v1.2.1-Windows-x64/IEGORandomizer.exe" "$isoDir/IEGORandomizer.exe"

          # 1. Verify CLI help boots cleanly without external DLLs or .NET lookup
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $helpOut = & "$isoDir/IEGORandomizer.exe" --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpOut -notmatch "--output-cia" -or $helpOut -notmatch "--fbi-update" -or $helpOut -notmatch "v1.2.1") {
            throw "IEGORandomizer.exe --help verification failed."
          }

          # 2. Verify Desktop GUI HTTP host boots cleanly from isolated single-file .exe
          $proc = Start-Process -FilePath "$isoDir/IEGORandomizer.exe" `
            -ArgumentList "--no-browser","--port","5189" `
            -WorkingDirectory $isoDir `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:5189/api/health" -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.version -eq "1.2.1") {
                  $ready = $true
                  break
                }
              } catch { }
            }

            if (-not $ready) {
              throw "IEGORandomizer.exe v1.2.1 failed to respond on http://127.0.0.1:5189/api/health"
            }

            $indexResp = Invoke-WebRequest -Uri "http://127.0.0.1:5189/" -UseBasicParsing
            if ($indexResp.StatusCode -ne 200 -or $indexResp.Content -notmatch "v1.2.1") {
              throw "Embedded v1.2.1 index.html check failed."
            }

            $jsResp = Invoke-WebRequest -Uri "http://127.0.0.1:5189/app.js" -UseBasicParsing
            if ($jsResp.StatusCode -ne 200) {
              throw "Embedded app.js check failed."
            }

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5189/api/app/shutdown" | Out-Null
            Start-Sleep -Seconds 1
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package v1.2.1 ZIP, Create v1.2.1-win64 Release & Record Checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path "release/IEGORandomizer-Windows-x64.zip")) {
            throw "Safety check failed: original v1.0.2 release/IEGORandomizer-Windows-x64.zip must remain intact!"
          }

          $v121Dir = "release/v1.2.1"
          New-Item -ItemType Directory -Force -Path $v121Dir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "IEGORandomizer-v1.2.1-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }

          Compress-Archive -Path "publish_win64/IEGORandomizer-v1.2.1-Windows-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal

          $exeHash = (Get-FileHash "publish_win64/IEGORandomizer-v1.2.1-Windows-x64/IEGORandomizer.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          $zipSizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)

          @(
            "$zipHash  IEGORandomizer-v1.2.1-Windows-x64.zip ($zipSizeMb MB)"
            "$exeHash  IEGORandomizer.exe (v1.2.1)"
          ) | Set-Content -Path "$v121Dir/SHA256SUMS.txt" -Encoding UTF8

          Write-Host "Packaged $zipPath ($zipSizeMb MB) - SHA256: $zipHash"

          $tagName = "v1.2.1-win64"
          $existing = gh release view $tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $zipPath "$v121Dir/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tagName $zipPath "$v121Dir/SHA256SUMS.txt" `
              --target arena/799dcf14-lynx `
              --title "IEGO Randomizer v1.2.1 (Windows x64 — Fix Anti-Softlock Porteros de Pachanga + Tiro Nv.1 Garantizado + Actualización FBI V.1.2.1)" `
              --notes "Versión ejecutable independiente (self-contained) v1.2.1 para Windows 10/11 (64 bits) con lanzadores automáticos en 1 clic de Actualización FBI (V.1.2.1 = 1057 > V.1.2.0 = 1056) para Nintendo 2DS/3DS. Corrige de raíz el softlock en pachangas tempranas: (1) Garantía 100% de supertécnica individual de TIRO (whsXXXX, PartnerNumber <= 1, PT <= 45) a Nivel 1 en Arion (para_cp0008), Riccardo (para_cp0009) y al menos 2 titulares tempranos más del Raimon, con PT suficientes para tirar varias veces desde el minuto 0; (2) Fin de los porteros muro en pachangas 5v5: los jugadores en portería de pachanga ya nunca son forzados a Posición=Portero, ni reciben paradas de portero whkXXXX a Nv.1, ni Espíritu Guerrero inicial, ni Guantes de portero; (3) Calibración exacta de estadísticas Base Nv.1 según GOStatCalculator (0x0033E404), eliminando el suelo artificial 65..95 en Catch Nv.1 que convertía porteros de nivel 2 en muros de nivel 85; (4) Mantiene íntegros todos los arreglos y sistemas de v1.2.0 (duelo Victor btl0302, formaciones ifb01XX, técnicas dinámicas .nutb y randomización de Entrenadores, Gerentes y NPCs)."
          }

          git checkout -- NuGet.Config

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$v121Dir/SHA256SUMS.txt"
          git diff --cached --quiet || (git commit -m "chore(release): record Windows x64 self-contained v1.2.1 release checksums [skip ci]" && git push origin HEAD:arena/799dcf14-lynx)
