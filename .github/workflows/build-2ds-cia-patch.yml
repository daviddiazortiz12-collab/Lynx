name: Build & Publish Lightweight 2DS Update Patch .CIA

on:
  push:
    branches:
      - arena/799dcf14-lynx
    paths:
      - '.cia-build-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lightweight-2ds-cia:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout branch arena/799dcf14-lynx
        uses: actions/checkout@v4
        with:
          ref: arena/799dcf14-lynx
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Official Microsoft NuGet Feed
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.Config

      - name: Build & Run Full 38-Test Hardware + IE4P/IE4R C99 Engine Suite
        run: |
          dotnet build IEGORandomizer.sln --configuration Release
          dotnet run --project tests/IEGORandomizer.Tests/IEGORandomizer.Tests.csproj --configuration Release --no-build

      - name: Build & Cold-Verify All-in-One v1.2.6 2DS Patcher + On-Console Seed Randomizer .CIA
        run: |
          exec > >(tee -a /tmp/cia_step.log) 2>&1
          trap 'rc=$?; if [ $rc -ne 0 ]; then echo "::error::Step failed (rc=$rc): $(tail -n 25 /tmp/cia_step.log | tr "\n" " " | cut -c1-900)"; fi' EXIT

          if [ ! -f .cia-build-request.json ]; then
            echo "No .cia-build-request.json found; skipping."
            exit 0
          fi

          INSTALLED_ID=$(jq -r '.installedRandomizadoId // empty' .cia-build-request.json)
          CLEAN_REF_ID=$(jq -r '.cleanReferenceId // empty' .cia-build-request.json)

          if [ -z "$INSTALLED_ID" ] || [ -z "$CLEAN_REF_ID" ]; then
            echo "ERROR: Missing Google Drive IDs in .cia-build-request.json"
            exit 1
          fi
          echo "::add-mask::${INSTALLED_ID}"
          echo "::add-mask::${CLEAN_REF_ID}"

          python3 -m venv /tmp/py
          /tmp/py/bin/pip install --quiet --upgrade pip gdown qrcode pillow
          rm -rf src/IEGORandomizer.Updater2DS/romfs
          mkdir -p /tmp/cia_work /tmp/cia_out src/IEGORandomizer.Updater2DS/romfs

          echo "Downloading installed _Randomizado.cia from Google Drive..."
          /tmp/py/bin/gdown --retries 5 "${INSTALLED_ID}" -O /tmp/cia_work/installed_randomizado.cia
          echo "Downloading clean retail reference .cia from Google Drive..."
          /tmp/py/bin/gdown --retries 5 "${CLEAN_REF_ID}" -O /tmp/cia_work/clean_retail.cia
          ls -lh /tmp/cia_work/*.cia

          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            src/IEGORandomizer.Updater2DS/host_verify.c \
            src/IEGORandomizer.Updater2DS/source/pxi_romfs.c \
            src/IEGORandomizer.Updater2DS/source/ie4p_core.c \
            src/IEGORandomizer.Updater2DS/source/ie4p_seed.c \
            -o /tmp/ie4p_host_verify

          /tmp/ie4p_host_verify --pxi-self-test

          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/makerom_src
          make -C /tmp/makerom_src/makerom deps -j4
          make -C /tmp/makerom_src/makerom -j4

          # Compile ARM11 2DS ELF (with PxiFS0 0x24 Title Access + 4KB DMA + csvc.s + seed engine) + SMDH icon
          docker run --rm -v "$PWD/src/IEGORandomizer.Updater2DS:/work" -w /work devkitpro/devkitarm:latest \
            bash -ce '
              export DEVKITPRO=/opt/devkitpro
              export DEVKITARM=/opt/devkitpro/devkitARM
              export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH
              arm-none-eabi-gcc -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft \
                -O2 -Wall -Wextra -mword-relocations -ffunction-sections -D__3DS__ \
                -I/opt/devkitpro/libctru/include -I/work/source \
                /work/source/main.c /work/source/pxi_romfs.c /work/source/ie4p_core.c /work/source/ie4p_seed.c /work/source/csvc.s \
                -specs=3dsx.specs -L/opt/devkitpro/libctru/lib -lctru -lm \
                -o /work/updater_2ds.elf
              smdhtool --create "IEGO Luz Randomizer v1.2.6" \
                "Reparador + Generador de Seeds en Consola 2DS" \
                "Lynx IEGO Randomizer" \
                /work/icon.png /work/updater_2ds.smdh
              ls -lh /work/updater_2ds.elf /work/updater_2ds.smdh
            '

          # =========================================================================
          # 1) Build & Cold-Verify Mode [A]: Surgical Repair Pack (patch_repair.ie4p)
          #    INCLUDING end-to-end Process9 PxiFS0 (0x24 path + 0x3F mask + 4KB DMA)
          #    reconstruction directly from /tmp/cia_work/installed_randomizado.cia!
          # =========================================================================
          REPAIR_PACK="$PWD/src/IEGORandomizer.Updater2DS/romfs/patch_repair.ie4p"
          IE4P_EXPORT_INSTALLED_BASE=1 dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- \
            --cli \
            --repair-installed /tmp/cia_work/installed_randomizado.cia \
            --clean-reference /tmp/cia_work/clean_retail.cia \
            --output /tmp/cia_work/repaired_v126_ie_a.fa \
            --export-2ds-delta-pack "$REPAIR_PACK"

          INSTALLED_FA="/tmp/cia_work/repaired_v126_ie_a.fa.installed_base.fa"
          ls -lh "$REPAIR_PACK" "$INSTALLED_FA"

          /tmp/ie4p_host_verify --pxi-cia /tmp/cia_work/installed_randomizado.cia "$REPAIR_PACK" /tmp/cia_work/recon_repair.fa
          SHA_EXPECTED=$(sha256sum /tmp/cia_work/repaired_v126_ie_a.fa | awk '{print $1}')
          SHA_ACTUAL=$(sha256sum /tmp/cia_work/recon_repair.fa | awk '{print $1}')
          echo "Surgical Repair Target SHA-256         : $SHA_EXPECTED"
          echo "PxiFS0 (0x24 + 4KB DMA) Recon SHA-256  : $SHA_ACTUAL"
          test "$SHA_EXPECTED" = "$SHA_ACTUAL"
          rm -f /tmp/cia_work/recon_repair.fa /tmp/cia_work/repaired_v126_ie_a.fa

          # =========================================================================
          # 2) Build & Cold-Verify Mode [X]/[Y]: On-Console Seed Recipe (seed_recipe.ie4r)
          # =========================================================================
          SEED_RECIPE="$PWD/src/IEGORandomizer.Updater2DS/romfs/seed_recipe.ie4r"
          dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- \
            --cli \
            --input "$INSTALLED_FA" \
            --clean-reference /tmp/cia_work/clean_retail.cia \
            --build-2ds-seed-recipe "$SEED_RECIPE"

          ls -lh "$SEED_RECIPE"

          # Execute the actual C99 ARM11 seed randomizer over the real 855 MB installed ie_a.fa!
          /tmp/ie4p_host_verify --seed "$INSTALLED_FA" "$SEED_RECIPE" "DAVID-2DS-VERIFY" /tmp/cia_work/recon_seed_a.fa
          /tmp/ie4p_host_verify --seed "$INSTALLED_FA" "$SEED_RECIPE" "david-2ds-verify" /tmp/cia_work/recon_seed_b.fa
          SHA_SEED_A=$(sha256sum /tmp/cia_work/recon_seed_a.fa | awk '{print $1}')
          SHA_SEED_B=$(sha256sum /tmp/cia_work/recon_seed_b.fa | awk '{print $1}')
          echo "On-Console Seed 'DAVID-2DS-VERIFY' SHA-256 : $SHA_SEED_A"
          test "$SHA_SEED_A" = "$SHA_SEED_B"

          # Diagnose the C99-generated 855 MB randomized archive with SafeGOGame!
          dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- \
            --cli --diagnose --input /tmp/cia_work/recon_seed_a.fa

          rm -rf /tmp/cia_work

          # =========================================================================
          # 3) Package Unified All-in-One .CIA (patch_repair.ie4p + seed_recipe.ie4r)
          # =========================================================================
          ALL_CIA="/tmp/cia_out/InazumaElevenGO_Luz_ParcheYRandomizer_v1.2.6_2DS.cia"
          (
            cd src/IEGORandomizer.Updater2DS
            /tmp/makerom_src/makerom/bin/makerom \
              -f cia \
              -o "$ALL_CIA" \
              -rsf app.rsf \
              -elf updater_2ds.elf \
              -icon updater_2ds.smdh \
              -ver 1071
          )
          dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- --inspect-cia "$ALL_CIA"

          ls -lh /tmp/cia_out/*.cia
          (cd /tmp/cia_out && sha256sum *.cia > SHA256SUMS.txt)
          cat /tmp/cia_out/SHA256SUMS.txt

      - name: Upload All-in-One v1.2.6 2DS .CIA + FBI QR Code to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          CIA_NAME="InazumaElevenGO_Luz_ParcheYRandomizer_v1.2.6_2DS.cia"
          CIA_PATH="/tmp/cia_out/${CIA_NAME}"
          if [ ! -f "$CIA_PATH" ]; then
            echo "No .CIA output to publish."
            exit 0
          fi

          REL_TAG=$(jq -r '.releaseTag // "v1.2.6-2ds-patch"' .cia-build-request.json)
          URL_CIA="https://github.com/${REPO_SLUG}/releases/download/${REL_TAG}/${CIA_NAME}"

          /tmp/py/bin/python -c "import qrcode; qrcode.make('${URL_CIA}').save('/tmp/cia_out/QR_FBI_ParcheYRandomizer_v1.2.6.png')"

          CIA_MB=$(awk "BEGIN {printf \"%.2f\", $(stat -c%s "$CIA_PATH")/1048576}")
          NOTES_FILE="/tmp/cia_out/RELEASE_NOTES.md"
          python3 src/IEGORandomizer.Updater2DS/write_release_notes.py "$NOTES_FILE" "$CIA_MB" "$CIA_NAME"

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" \
              "$CIA_PATH" \
              /tmp/cia_out/QR_FBI_ParcheYRandomizer_v1.2.6.png \
              /tmp/cia_out/SHA256SUMS.txt \
              --clobber
            gh release edit "$REL_TAG" --title "Parche + Randomizador de Seeds en Consola 2DS v1.2.6 (Todo-en-1)" --notes-file "$NOTES_FILE"
          else
            gh release create "$REL_TAG" \
              "$CIA_PATH" \
              /tmp/cia_out/QR_FBI_ParcheYRandomizer_v1.2.6.png \
              /tmp/cia_out/SHA256SUMS.txt \
              --target arena/799dcf14-lynx \
              --title "Parche + Randomizador de Seeds en Consola 2DS v1.2.6 (Todo-en-1)" \
              --notes-file "$NOTES_FILE"
          fi
