name: Build & Publish Lightweight 2DS Update Patch .CIA

on:
  push:
    branches:
      - arena/799dcf14-lynx
    paths:
      - '.cia-build-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lightweight-2ds-cia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch arena/799dcf14-lynx
        uses: actions/checkout@v4
        with:
          ref: arena/799dcf14-lynx
          fetch-depth: 0

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Official Microsoft NuGet Feed
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org --configfile NuGet.Config

      - name: Build & Run Full 36-Test Hardware + IE4P C99 Engine Suite
        run: |
          dotnet build IEGORandomizer.sln --configuration Release
          dotnet run --project tests/IEGORandomizer.Tests/IEGORandomizer.Tests.csproj --configuration Release --no-build

      - name: Generate Verified IE4P Delta Pack & Compile ARM11 2DS Updater .CIA
        run: |
          if [ ! -f .cia-build-request.json ]; then
            echo "No .cia-build-request.json found; skipping."
            exit 0
          fi

          GDRIVE_ID=$(jq -r '.gdriveSourceId // .gdriveCiaId // empty' .cia-build-request.json)
          INPUT_PRESET=$(jq -r '.preset // "full"' .cia-build-request.json)
          INPUT_SEED=$(jq -r '.seed // empty' .cia-build-request.json)
          OVER_VANILLA=$(jq -r '.overVanillaOnly // "false"' .cia-build-request.json)

          if [ -z "$GDRIVE_ID" ]; then
            echo "ERROR: gdriveSourceId missing in .cia-build-request.json"
            exit 1
          fi
          echo "::add-mask::${GDRIVE_ID}"

          python3 -m pip install --quiet --upgrade gdown qrcode pillow
          mkdir -p /tmp/cia_work /tmp/cia_out src/IEGORandomizer.Updater2DS/romfs

          python3 -m gdown --fuzzy "https://drive.google.com/uc?id=${GDRIVE_ID}" -O /tmp/cia_work/raw_download.bin
          ls -lh /tmp/cia_work/raw_download.bin

          MAGIC_HEX=$(head -c 4 /tmp/cia_work/raw_download.bin | xxd -p)
          if [ "$MAGIC_HEX" = "41524330" ]; then
            SRC_INPUT="/tmp/cia_work/ie_a.fa"
            mv /tmp/cia_work/raw_download.bin "$SRC_INPUT"
            echo "Detected standalone Level-5 ARC0 archive (ie_a.fa)."
          else
            SRC_INPUT="/tmp/cia_work/source_base.cia"
            mv /tmp/cia_work/raw_download.bin "$SRC_INPUT"
            echo "Detected Nintendo 3DS .CIA container."
          fi

          EXTRA_ARGS=()
          if [ -n "$INPUT_SEED" ]; then
            EXTRA_ARGS+=(--seed "$INPUT_SEED")
          fi
          if [ "$OVER_VANILLA" = "true" ]; then
            EXTRA_ARGS+=(--delta-over-vanilla)
          fi

          PACK_FILE="$PWD/src/IEGORandomizer.Updater2DS/romfs/patch_v123.ie4p"
          dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- \
            --cli \
            --input "$SRC_INPUT" \
            --output /tmp/cia_work/patched_out \
            --preset "$INPUT_PRESET" \
            "${EXTRA_ARGS[@]}" \
            --export-2ds-delta-pack "$PACK_FILE"

          ls -lh "$PACK_FILE"

          # Cold-verify C99 streaming engine against target patched ie_a.fa if input was ie_a.fa
          TARGET_FA=$(find /tmp/cia_work/patched_out -name "ie_a.fa" | head -n 1)
          if [ -f "/tmp/cia_work/ie_a.fa" ] && [ -n "$TARGET_FA" ]; then
            gcc -std=c99 -O2 -Wall -Wextra -Werror src/IEGORandomizer.Updater2DS/host_verify.c src/IEGORandomizer.Updater2DS/source/ie4p_core.c -o /tmp/ie4p_host_verify
            /tmp/ie4p_host_verify /tmp/cia_work/ie_a.fa "$PACK_FILE" /tmp/cia_work/reconstructed_check.fa
            ORIG_TARGET_SHA=$(sha256sum "$TARGET_FA" | awk '{print $1}')
            RECON_SHA=$(sha256sum /tmp/cia_work/reconstructed_check.fa | awk '{print $1}')
            echo "Target SHA-256       : $ORIG_TARGET_SHA"
            echo "Reconstructed SHA-256: $RECON_SHA"
            test "$ORIG_TARGET_SHA" = "$RECON_SHA"
            rm -f /tmp/cia_work/reconstructed_check.fa
          fi
          rm -rf /tmp/cia_work

          # 1) Compile ARM11 2DS ELF + SMDH icon inside official devkitpro/devkitarm container
          docker run --rm -v "$PWD/src/IEGORandomizer.Updater2DS:/work" -w /work devkitpro/devkitarm:latest \
            bash -lc "make clean && make -j4 && ls -lh updater_2ds.elf updater_2ds.smdh"

          # 2) Build CTR makerom and package standalone installable 2DS .CIA
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/makerom_src
          make -C /tmp/makerom_src/makerom deps -j4
          make -C /tmp/makerom_src/makerom -j4

          OUT_CIA="/tmp/cia_out/InazumaElevenGO_Luz_ParcheLigero_v1.2.3_2DS.cia"
          (
            cd src/IEGORandomizer.Updater2DS
            /tmp/makerom_src/makerom/bin/makerom \
              -f cia \
              -o "$OUT_CIA" \
              -rsf app.rsf \
              -elf updater_2ds.elf \
              -icon updater_2ds.smdh \
              -ver 1059
          )

          ls -lh "$OUT_CIA"
          # Cold-inspect the generated .CIA using our own 3DS CIA inspector
          dotnet run --project src/IEGORandomizer.App/IEGORandomizer.App.csproj --configuration Release --no-build -- \
            --inspect-cia "$OUT_CIA"

          (cd /tmp/cia_out && sha256sum "InazumaElevenGO_Luz_ParcheLigero_v1.2.3_2DS.cia" > SHA256SUMS.txt)
          cat /tmp/cia_out/SHA256SUMS.txt

      - name: Upload Lightweight 2DS .CIA + FBI QR Code to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          if [ ! -f /tmp/cia_out/InazumaElevenGO_Luz_ParcheLigero_v1.2.3_2DS.cia ]; then
            echo "Nothing to upload."
            exit 0
          fi
          REL_TAG=$(jq -r '.releaseTag // "v1.2.3-2ds-patch"' .cia-build-request.json)
          OUT_CIA="/tmp/cia_out/InazumaElevenGO_Luz_ParcheLigero_v1.2.3_2DS.cia"
          CIA_NAME="InazumaElevenGO_Luz_ParcheLigero_v1.2.3_2DS.cia"
          DIRECT_URL="https://github.com/${REPO_SLUG}/releases/download/${REL_TAG}/${CIA_NAME}"

          python3 -c "import qrcode; qrcode.make('${DIRECT_URL}').save('/tmp/cia_out/QR_Instalar_En_FBI_2DS.png')"

          SIZE_MB=$(du -m "$OUT_CIA" | awk '{print $1}')
          NOTES_FILE="/tmp/cia_out/RELEASE_NOTES.md"
          python3 src/IEGORandomizer.Updater2DS/write_release_notes.py "$NOTES_FILE" "$SIZE_MB" "$CIA_NAME"

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$OUT_CIA" /tmp/cia_out/QR_Instalar_En_FBI_2DS.png /tmp/cia_out/SHA256SUMS.txt --clobber
            gh release edit "$REL_TAG" --title "Parche Ligero Independiente .CIA para 2DS (v1.2.3)" --notes-file "$NOTES_FILE"
          else
            gh release create "$REL_TAG" "$OUT_CIA" /tmp/cia_out/QR_Instalar_En_FBI_2DS.png /tmp/cia_out/SHA256SUMS.txt \
              --target arena/799dcf14-lynx \
              --title "Parche Ligero Independiente .CIA para 2DS (v1.2.3)" \
              --notes-file "$NOTES_FILE"
          fi
